<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>星河通讯管理后台</title>
  <style>
    body{margin:0;padding:32px;font-family:Arial,"Microsoft YaHei",sans-serif;color:#172330;background:#f3f7f5}
    main{max-width:1100px;margin:auto;padding:28px;border-radius:18px;background:#fff;box-shadow:0 12px 40px #193b4218}
    h1{margin-top:0}.hint{color:#718184}.status{margin:18px 0;color:#c75f52}
    table{width:100%;border-collapse:collapse}th,td{padding:12px;text-align:left;border-bottom:1px solid #e5ecea;font-size:14px}
    th{color:#607175;background:#f7faf9}.empty{padding:24px;color:#718184}
  </style>
</head>
<body>
  <main>
    <h1>星河通讯管理后台</h1>
    <p class="hint">仅显示用户名、昵称、注册时间、最近登录 IP 和最近登录时间。出于安全原因，密码及密码哈希永不显示。</p>
    <div class="status" id="status"></div>
    <table><thead><tr><th>ID</th><th>用户名</th><th>昵称</th><th>注册时间</th><th>最近登录 IP</th><th>最近登录时间</th></tr></thead><tbody id="rows"></tbody></table>
  </main>
  <script>
    const key = prompt('请输入管理员密钥');
    const status = document.querySelector('#status');
    fetch('/admin/api/users', { headers: { 'X-Admin-Key': key || '' } })
      .then(async response => { const data = await response.json(); if (!response.ok) throw new Error(data.error || '加载失败'); return data; })
      .then(data => { document.querySelector('#rows').innerHTML = data.users.length ? data.users.map(user => `<tr><td>${user.id}</td><td>${escapeHtml(user.username)}</td><td>${escapeHtml(user.display_name)}</td><td>${escapeHtml(user.created_at || '')}</td><td>${escapeHtml(user.last_login_ip || '暂无')}</td><td>${escapeHtml(user.last_login_at || '暂无')}</td></tr>`).join('') : '<tr><td colspan="6" class="empty">暂无会员</td></tr>'; })
      .catch(error => { status.textContent = error.message; });
    function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char])); }
  </script>
</body>
</html>
